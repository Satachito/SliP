name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: slip-linux-x86_64
          - os: macos-latest
            asset: slip-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          clang++ -std=c++23 -O2 \
            C++/CLI.cpp C++/SliP.cpp C++/Read.cpp C++/Eval.cpp C++/json.cpp \
            -o ${{ matrix.asset }}

      # A binary that cannot run a program is not worth attaching to a release.
      - name: Smoke
        run: |
          set -e
          ./${{ matrix.asset }} -v
          [ "$( ./${{ matrix.asset }} -e '( 2 + 2 )' )" = "4" ]
          printf '// comment\n( ( "ok" ) : ; )\n' > smoke.slip
          [ "$( ./${{ matrix.asset }} smoke.slip )" = '"ok"' ]
          printf '( 1 + 1 )\n( 3 × )\n' > bad.slip
          if ./${{ matrix.asset }} bad.slip 2>err.txt; then echo "expected failure"; exit 1; fi
          grep -q 'bad.slip:2:' err.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          xcodebuild -project SliP.xcodeproj -target SwiftUI-CPP \
            -configuration Release CODE_SIGNING_ALLOWED=NO build

      # The bundle has to say what it is before it is worth attaching.
      - name: Check the bundle
        run: |
          set -e
          APP=build/Release/SwiftUI-CPP.app
          PLIST=$APP/Contents/Info.plist
          [ -d "$APP" ]
          [ "$( /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$PLIST" )" = "SliP" ]
          [ -f "$APP/Contents/Resources/AppIcon.icns" ]
          # The app's version must be the engine's version.
          ENGINE=$( grep -oE 'SLIP_VERSION = "[^"]+"' C++/SliP.hpp | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' )
          BUNDLE=$( /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST" )
          [ "$ENGINE" = "$BUNDLE" ] || { echo "engine $ENGINE != bundle $BUNDLE"; exit 1; }

      - name: Zip
        run: |
          ditto -c -k --keepParent build/Release/SwiftUI-CPP.app SliP-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SliP-macos
          path: SliP-macos.zip

  release:
    needs: [ cli, app ]
    runs-on: ubuntu-latest
    if: startsWith( github.ref, 'refs/tags/v' )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

          ### Downloads

          | File | What |
          |------|------|
          | `slip-macos-arm64`, `slip-linux-x86_64` | The `slip` command line tool |
          | `SliP-macos.zip` | The macOS app |

          The app is **not signed or notarized**, so macOS will refuse to open it
          on the first try. Right-click it in Finder and choose Open, then
          confirm — after that it launches normally.

          `npm i @satachito/slip` installs the same engine for JavaScript.
          NOTES
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            artifacts/*/slip-* artifacts/*/SliP-macos.zip
