name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: slip-linux-x86_64
          - os: macos-latest
            asset: slip-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          clang++ -std=c++23 -O2 \
            C++/CLI.cpp C++/SliP.cpp C++/Read.cpp C++/Eval.cpp C++/json.cpp \
            -o ${{ matrix.asset }}

      # A binary that cannot run a program is not worth attaching to a release.
      - name: Smoke
        run: |
          set -e
          ./${{ matrix.asset }} -v
          [ "$( ./${{ matrix.asset }} -e '( 2 + 2 )' )" = "4" ]
          printf '// comment\n( ( "ok" ) : ; )\n' > smoke.slip
          [ "$( ./${{ matrix.asset }} smoke.slip )" = '"ok"' ]
          printf '( 1 + 1 )\n( 3 × )\n' > bad.slip
          if ./${{ matrix.asset }} bad.slip 2>err.txt; then echo "expected failure"; exit 1; fi
          grep -q 'bad.slip:2:' err.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  app:
    runs-on: macos-15
    env:
      APP: build/Release/SliP.app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Signing is optional: without the secrets the app still builds and is
      # still attached, just unsigned. That keeps the release path working for
      # anyone who forks this, and means adding the secrets is the only step
      # between here and a notarized build.
      - name: Is signing configured
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEY: ${{ secrets.AC_API_KEY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ] && [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarization are configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets absent — attaching an unsigned app."
          fi

      - name: Import the certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral: the keychain and its password live only in this job.
          PWD_=$( uuidgen )
          security create-keychain -p "$PWD_" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PWD_" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # "MAC verification failed ( wrong password? )" here is usually not
          # the password: OpenSSL 3 writes PKCS#12 with PBES2 / AES-256-CBC,
          # which Apple's security tool cannot read, and it reports that as a
          # password error. Export with `openssl pkcs12 -export -legacy`.
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          then
            echo "::error::Could not import MACOS_CERTIFICATE. If the password is right, the .p12 is probably in OpenSSL 3's default format — re-export it with -legacy."
            exit 1
          fi
          # Without this, codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PWD_" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          # Hardened runtime is a precondition for notarization, not a nicety.
          # So is NOT carrying get-task-allow: Xcode injects that debug
          # entitlement by default, and Apple rejects any submission with it —
          # which is how the first attempt at this came back "Invalid".
          xcodebuild -project SliP.xcodeproj -target SwiftUI-CPP \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.MACOS_SIGNING_IDENTITY }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      # Cheaper to catch here than to learn from Apple minutes later.
      - name: Check the signature is notarizable
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -e
          codesign -dvvv "$APP" 2>&1 | grep -q "flags=0x10000(runtime)" \
            || { echo "::error::hardened runtime missing"; exit 1; }
          codesign -dvvv "$APP" 2>&1 | grep -q "^Timestamp=" \
            || { echo "::error::no secure timestamp"; exit 1; }
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::get-task-allow is present; Apple will reject this"
            exit 1
          fi

      - name: Build (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          xcodebuild -project SliP.xcodeproj -target SwiftUI-CPP \
            -configuration Release CODE_SIGNING_ALLOWED=NO build

      # The bundle has to say what it is before it is worth attaching.
      - name: Check the bundle
        run: |
          set -e
          PLIST="$APP/Contents/Info.plist"
          [ -d "$APP" ]
          [ "$( /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$PLIST" )" = "SliP" ]
          [ -f "$APP/Contents/Resources/AppIcon.icns" ]
          # The app's version must be the engine's version.
          ENGINE=$( grep -oE 'SLIP_VERSION = "[^"]+"' C++/SliP.hpp | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' )
          BUNDLE=$( /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST" )
          [ "$ENGINE" = "$BUNDLE" ] || { echo "engine $ENGINE != bundle $BUNDLE"; exit 1; }

      - name: Zip
        run: ditto -c -k --keepParent "$APP" SliP-macos.zip

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -e
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY" > "$KEY"
          CREDS=( --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" )

          # "status: Invalid" means Apple looked and objected, and the summary
          # alone does not say to what. Fetch the itemised log before failing,
          # or the next person is left guessing at exactly the wrong moment.
          set +e
          xcrun notarytool submit SliP-macos.zip "${CREDS[@]}" --wait \
            --output-format json > "$RUNNER_TEMP/submit.json"
          RC=$?
          set -e
          cat "$RUNNER_TEMP/submit.json"
          ID=$( jq -r '.id // empty' < "$RUNNER_TEMP/submit.json" )
          STATUS=$( jq -r '.status // empty' < "$RUNNER_TEMP/submit.json" )
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization returned ${STATUS:-no status}"
            [ -n "$ID" ] && xcrun notarytool log "$ID" "${CREDS[@]}" || true
            rm -f "$KEY"
            exit "${RC:-1}"
          fi
          rm -f "$KEY"
          # The ticket is stapled to the .app, so the archive has to be rebuilt.
          xcrun stapler staple "$APP"
          rm -f SliP-macos.zip
          ditto -c -k --keepParent "$APP" SliP-macos.zip

      # Assert what a downloader's Mac will conclude, rather than assuming it.
      - name: Verify the signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -e
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Record whether it was signed
        run: echo "${{ steps.signing.outputs.enabled }}" > signed.txt

      - name: Clean up the keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security list-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: SliP-macos
          path: |
            SliP-macos.zip
            signed.txt

  release:
    needs: [ cli, app ]
    runs-on: ubuntu-latest
    if: startsWith( github.ref, 'refs/tags/v' )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > notes.md <<'NOTES'
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

          ### Downloads

          | File | What |
          |------|------|
          | `slip-macos-arm64`, `slip-linux-x86_64` | The `slip` command line tool |
          | `SliP-macos.zip` | The macOS app |

          NOTES

          # Say which one it is. Telling people to right-click a notarized app
          # is noise; staying quiet about an unsigned one leaves them stuck.
          if [ "$( cat artifacts/SliP-macos/signed.txt )" = "true" ]; then
            echo "The app is signed and notarized, so it opens normally." >> notes.md
          else
            cat >> notes.md <<'NOTES'
          The app is **not signed or notarized**, so macOS will refuse to open it
          on the first try. Right-click it in Finder and choose Open, then
          confirm — after that it launches normally.
          NOTES
          fi

          cat >> notes.md <<'NOTES'

          `npm i @satachito/slip` installs the same engine for JavaScript.
          NOTES

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            artifacts/*/slip-* artifacts/SliP-macos/SliP-macos.zip
