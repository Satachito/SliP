name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: slip-linux-x86_64
          - os: macos-latest
            asset: slip-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          clang++ -std=c++23 -O2 \
            C++/CLI.cpp C++/SliP.cpp C++/Read.cpp C++/Eval.cpp C++/json.cpp \
            -o ${{ matrix.asset }}

      # A binary that cannot run a program is not worth attaching to a release.
      - name: Smoke
        run: |
          set -e
          ./${{ matrix.asset }} -v
          [ "$( ./${{ matrix.asset }} -e '( 2 + 2 )' )" = "4" ]
          printf '// comment\n( ( "ok" ) : ; )\n' > smoke.slip
          [ "$( ./${{ matrix.asset }} smoke.slip )" = '"ok"' ]
          printf '( 1 + 1 )\n( 3 × )\n' > bad.slip
          if ./${{ matrix.asset }} bad.slip 2>err.txt; then echo "expected failure"; exit 1; fi
          grep -q 'bad.slip:2:' err.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: cli
    runs-on: ubuntu-latest
    if: startsWith( github.ref, 'refs/tags/v' )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." \
            artifacts/*/slip-*
