name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      #	latest on purpose.  The deploy is how a version of Emscripten that
      #	breaks the build gets found, and a build nobody can reproduce with a
      #	current toolchain is not one worth deploying.  If this step fails, the
      #	site keeps whatever was published last.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: sh WASM/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node WASM/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
